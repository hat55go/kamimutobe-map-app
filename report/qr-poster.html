<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>上六人部 活動マップ｜QR案内</title>
  <link rel="icon" href="../icon-192.png">
  <link rel="stylesheet" href="qr-poster.css">
</head>
<body>
  <main class="poster">
    <div class="top-rule"></div>
    <p class="eyebrow">地域おこし協力隊の活動記録</p>
    <h1>上六人部<br>活動マップ</h1>
    <p class="lead">地域で見つけたことや場所を、<br>地図と写真でご覧いただけます。</p>
    <div class="qr-frame">
      <img src="qr-code.png" alt="上六人部 活動マップを開くQRコード">
    </div>
    <p class="scan">スマートフォンのカメラで<br><strong>QRコードを読み取ってください</strong></p>
    <p class="url">hat55go.github.io/kamimutobe-map-app/report/</p>
    <div class="notes">
      <span>登録不要</span>
      <span>閲覧無料</span>
      <span>いつでも最新</span>
    </div>
    <p class="footer">上六人部地域おこし協力隊</p>
  </main>
</body>
</html>

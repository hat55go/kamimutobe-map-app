<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f32">
  <meta name="robots" content="noindex,nofollow">
  <title>上六人部 活動マップ</title>
  <link rel="icon" href="../icon-192.png">
  <link rel="apple-touch-icon" href="../icon-180.png">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header class="site-header">
    <div class="header-main">
      <div>
        <p class="eyebrow">地域おこし協力隊の活動記録</p>
        <h1>上六人部 活動マップ</h1>
      </div>
      <div class="header-actions">
        <button id="share-button" type="button">共有</button>
        <button id="refresh-button" type="button">更新</button>
      </div>
    </div>
    <p class="intro">上六人部で見つけたこと、出会った場所、地域の魅力を地図と写真で紹介します。</p>
    <p id="update-status" class="update-status" aria-live="polite">最新情報を読み込んでいます…</p>
  </header>

  <main class="page-layout">
    <section class="map-panel" aria-label="公開記録の地図">
      <div id="map"></div>
      <div class="map-caption">ピンを押すと活動内容を確認できます</div>
    </section>

    <section class="feed-panel" aria-label="公開記録一覧">
      <div class="summary-row">
        <div><strong id="total-count">0</strong><span>公開中</span></div>
        <div><strong id="notes-count">0</strong><span>活動記録</span></div>
        <div><strong id="spots-count">0</strong><span>場所図鑑</span></div>
      </div>

      <nav class="tabs" aria-label="表示内容">
        <button class="tab active" type="button" data-kind="notes">📖 活動記録</button>
        <button class="tab" type="button" data-kind="spots">📍 場所図鑑</button>
      </nav>

      <div id="filter-chips" class="filter-chips" aria-label="カテゴリ絞り込み"></div>
      <div id="cards" class="cards"></div>
    </section>
  </main>

  <div id="detail-backdrop" class="detail-backdrop hidden">
    <article id="detail-card" class="detail-card" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <button id="detail-close" class="detail-close" type="button" aria-label="閉じる">×</button>
      <div id="detail-content"></div>
    </article>
  </div>

  <noscript>このページを表示するにはJavaScriptを有効にしてください。</noscript>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="../pin-types.js?v=10"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
